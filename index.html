<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FES GLOBAL PRO | Login & Live Scores</title>
    <style>
        :root {
            --bg: #050505; --surface: #121212; --primary: #0052ad;
            --text: #fff; --text-dim: #a1a1aa; --gold: #d4af37; --live: #ff4d4d;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }

        /* Auth Pages Styling */
        .auth-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; text-align: center;
        }
        .auth-card {
            background: var(--surface); padding: 30px; border-radius: 20px;
            border: 1px solid #333; width: 100%; max-width: 350px;
        }
        .auth-input {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px;
            border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box;
        }
        .auth-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .toggle-link { color: var(--primary); cursor: pointer; margin-top: 15px; display: block; font-size: 14px; }

        /* Main App Header & Content */
        #main-app { display: none; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .match-card { background: var(--surface); margin: 12px; padding: 15px; border-radius: 15px; border: 1px solid #222; }
        .team-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
        .score { font-size: 18px; font-weight: 800; color: var(--primary); }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
    </style>
</head>
