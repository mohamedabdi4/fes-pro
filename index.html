<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Bank - Clone</title>
    <style>
        /* Guud ahaan habaynta */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Card-ka weyn ee Login-ka */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Logo-ga Premier Bank Placeholder */
        .logo {
            color: #0056b3;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Inputyada */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0,86,179,0.2);
        }

        /* Button-ka */
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #003d80;
        }

        /* Linkyada hoose */
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: #0056b3;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Premier Bank</div>
        <p class="subtitle">Ku soo dhawaaw adeegga Premier Online</p>

        <form>
            <div class="input-group">
                <label>User ID</label>
                <input type="text" placeholder="Geli User ID-gaaga" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="********" required>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="footer-links">
            <p>Ma hilmaantay password-ka? <a href="#">Riix halkan</a></p>
            <p style="margin-top: 10px;">Ma haysatid akoon? <a href="#">Fur akoon cusub</a></p>
        </div>
    </div>

</body>
</html>
